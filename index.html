<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語靈陣線 (Lingo Frontline)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4">

    <!-- 頂部狀態列 -->
    <header class="w-full max-w-6xl flex justify-between items-center bg-slate-900 p-4 rounded-xl shadow-xl border border-slate-800">
        <div>
            <h1 class="text-2xl font-black text-amber-400 tracking-wider">🛡️ 語靈陣線 <span class="text-xs text-slate-400">Lingo Frontline</span></h1>
            <p class="text-xs text-slate-400">語言學習驅動 × 有得必有失的代價平衡 × 雙牌 Combo 隨機召喚</p>
        </div>
        <div class="flex gap-4 text-sm font-bold">
            <div class="bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">❤️ 主城生命: <span id="hp-display" class="text-red-400">20</span></div>
            <div class="bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">💰 語靈金幣: <span id="gold-display" class="text-amber-400">120</span></div>
            <div class="bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">⚔️ 防守波次: <span id="wave-display" class="text-blue-400">1 / 5</span></div>
        </div>
    </header>

    <!-- 主遊戲介面三欄式佈局 -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-4 gap-4 my-4">
        
        <!-- 左側：6位玩家親繪英雄靈魂展示區 -->
        <aside class="bg-slate-900 p-4 rounded-xl shadow-lg border border-slate-800 flex flex-col justify-between">
            <div>
                <h3 class="text-xs font-bold text-amber-400 mb-2 uppercase tracking-wider border-b border-slate-800 pb-2">👑 玩家親繪英雄 (6位核心)</h3>
                <p class="text-[11px] text-slate-400 mb-3">你親手繪製的主角靈魂，賦予全隊被動加成！</p>
                
                <div class="space-y-2">
                    <div class="bg-slate-950 p-2 rounded border border-slate-800 text-xs">
                        <span class="font-bold text-amber-300">1. 語靈劍士·艾爾</span>
                        <p class="text-[10px] text-slate-400">被動：近戰防禦力 +20%</p>
                    </div>
                    <div class="bg-slate-950 p-2 rounded border border-slate-800 text-xs">
                        <span class="font-bold text-purple-300">2. 元素使·希雅</span>
                        <p class="text-[10px] text-slate-400">被動：遠程法術暴擊率 +15%</p>
                    </div>
