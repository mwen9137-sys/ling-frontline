<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>語靈陣線：宇宙星際防線 (Cosmic Lingo Frontline)</title>
    <style>
        :root {
            --bg-deep: #02040a;
            --panel-bg: rgba(10, 15, 30, 0.9);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-gold: #ffd700;
            --neon-purple: #9d00ff;
            --text-main: #f0f6fc;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #0d1b2a 0%, #02040a 100%);
        }
        header h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            text-shadow: 0 0 15px var(--neon-cyan);
            letter-spacing: 3px;
        }
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: bold;
        }
        .stat-box {
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            padding: 6px 16px;
            border-radius: 6px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }
        .game-container {
            position: relative;
            width: 800px;
            margin: 0 auto;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            background: #050814;
            border-radius: 8px;
        }
        canvas {
            display: block;
            background: linear-gradient(90deg, #070d1d 0%, #02040a 100%);
        }
        .control-panel {
            width: 800px;
            margin: 10px auto;
            background: var(--panel-bg);
            border: 1px solid var(--neon-gold);
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
        .cards-flex {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .card {
            background: #0d1b2a;
            border: 2px solid var(--neon-cyan);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--neon-cyan);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }
        .card:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
            transform: translateY(-3px);
        }
        .card.selected {
            border-color: var(--neon-gold);
            background: #2a220d;
            color: var(--neon-gold);
            box-shadow: 0 0 20px var(--neon-gold);
        }
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            margin-top: 8px;
        }
        button.primary-btn {
            padding: 8px 22px;
            background: var(--neon-pink);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            transition: 0.2s;
        }
        button.primary-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }
        select {
            background: #0d1b2a;
            color: #fff;
            border: 1px solid var(--neon-gold);
            padding: 6px;
            border-radius: 4px;
            font-family: inherit;
        }
        #combo-display {
            color: var(--neon-gold);
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }
        #combat-log {
            color: var(--neon-cyan);
            font-weight: bold;
            height: 22px;
            margin-top: 5px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌌 語靈陣線：宇宙防線 🌌</h1>
    </header>

    <div class="dashboard">
        <div class="stat-box">🛸 艦隊穹頂防護: <span id="base-hp" style="color:var(--neon-pink);">1000</span>/1000</div>
        <div class="stat-box">⚡ 戰術能量 MP: <span id="mp-val" style="color:var(--neon-cyan);">10</span>/10</div>
        <div class="stat-box">🌠 星際波次: <span id="wave-val" style="color:var(--neon-gold);">Sector 1</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div class="control-panel">
        <div style="margin-bottom: 8px; font-size: 0.85rem; color: #aaa;">
            🌐 星際語系終端機設定：
            <select id="lang-select" onchange="changeLanguageMode()">
                <option value="en">English (Cosmic Terms)</option>
                <option value="ja">日本語 (宇宙・天体)</option>
                <option value="es">Español (Espacio Estelar)</option>
                <option value="zh">中文 (星際天文詞彙)</option>
            </select>
        </div>

        <div id="combo-display">🔥 雙卡星際 Combo 槽位: 點擊 2 張手牌進行元素躍遷融合 (已選 0/2)</div>
        <div class="cards-flex" id="hand-container"></div>

        <div class="action-bar">
            <button class="primary-btn" onclick="startVoiceRecognition()">🎙️ 啟動深空語音詠唱</button>
            <span id="mic-status" style="font-size: 0.85rem; color: var(--neon-gold);">等待艦長語音指令...</span>
        </div>
        <div id="combat-log">戰情室就緒：選定 2 張星際卡牌，並對著宇宙怪獸頭頂的單字發動聲波攻擊！</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = {
            baseHp: 1000,
            mp: 10,
            maxMp: 10,
            wave: 1,
            currentLang: 'en'
        };

        // 四國語系：宇宙怪獸與天文題庫
        const vocabDatabases = {
            en: [
                { word: "Orbit", meaning: "軌道", element: "water" },
                { word: "Meteor", meaning: "流星", element: "fire" },
                { word: "Gravity", meaning: "重力", element: "earth" },
                { word: "Nebula", meaning: "星雲", element: "light" },
                { word: "Eclipse", meaning: "蝕", element: "dark" },
                { word: "Pulsar", meaning: "脈衝星", element: "thunder" }
            ],
            ja: [
                { word: "Kousei", meaning: "恒星", element: "fire" },
                { word: "Inryoku", meaning: "引力", element: "earth" },
                { word: "Wakusei", meaning: "惑星", element: "water" },
                { word: "Kokū", meaning: "虚空", element: "dark" },
                { word: "Ryūsei", meaning: "流星", element: "thunder" }
            ],
            es: [
                { word: "Galaxia", meaning: "銀河", element: "light" },
                { word: "Cometa", meaning: "彗星", element: "water" },
                { word: "Gravedad", meaning: "重力", element: "earth" },
                { word: "Vacío", meaning: "虛空", element: "dark" },
                { word: "Eclipse", meaning: "日/月食", element: "fire" }
            ],
            zh: [
                { word: "星雲", meaning: "Nebula", element: "light" },
                { word: "黑洞", meaning: "Black Hole", element: "dark" },
                { word: "超新星", meaning: "Supernova", element: "fire" },
                { word: "磁場", meaning: "Magnetic Field", element: "thunder" },
                { word: "軌道", meaning: "Orbit", element: "water" }
            ]
        };

        // 宇宙風手牌
        let playerHand = [
            { id: 1, name: "星力·水 (Orbit)", element: "water", cost: 2 },
            { id: 2, name: "星力·火 (Meteor)", element: "fire", cost: 2 },
            { id: 3, name: "星力·雷 (Pulsar)", element: "thunder", cost: 3 },
            { id: 4, name: "星力·地 (Gravity)", element: "earth", cost: 2 },
            { id: 5, name: "星力·光 (Nebula)", element: "light", cost: 2 }
        ];

        let selectedCards = [];
        let enemies = [];
        let particles = [];

        function initHand() {
            const container = document.getElementById("hand-container");
            container.innerHTML = "";
            playerHand.forEach((card) => {
                let div = document.createElement("div");
                div.className = "card";
                div.dataset.id = card.id;
                div.innerHTML = `<b>${card.name}</b><br><small>消耗: ${card.cost} MP</small>`;
                div.onclick = () => toggleCardSelection(card, div);
                container.appendChild(div);
            });
        }

        function toggleCardSelection(card, elementNode) {
            const index = selectedCards.findIndex(c => c.id === card.id);
            if (index > -1) {
                selectedCards.splice(index, 1);
                elementNode.classList.remove("selected");
            } else {
                if (selectedCards.length < 2) {
                    selectedCards.push(card);
                    elementNode.classList.add("selected");
                } else {
                    document.getElementById("combat-log").innerText = "⚠️ 戰術槽已滿：最多只能選擇 2 張星際卡牌！";
                    return;
                }
            }
            updateComboStatus();
        }

        function updateComboStatus() {
            if (selectedCards.length === 2) {
                let comboName = getCosmicCombo(selectedCards[0].element, selectedCards[1].element);
                document.getElementById("combo-display").innerText = `⚡ 躍遷融合就緒！【${comboName}】 ➔ 準備聲波詠唱！`;
            } else {
                document.getElementById("combo-display").innerText = `🔥 雙卡星際 Combo 槽位: 已選 ${selectedCards.length}/2 張`;
            }
        }

        function getCosmicCombo(el1, el2) {
            let pair = [el1, el2].sort().join("+");
            if (pair === "fire+water") return "超新星蒸發流 (Supernova Vapor)";
            if (pair === "earth+fire") return "熔岩軌道轰击 (Magma Bombardment)";
            if (pair === "light+water") return "星塵極光陣 (Stardust Aurora)";
            if (pair === "dark+fire") return "暗黑黑洞引爆 (Singularity Blast)";
            return "深空元素躍遷 (Warp Resonance)";
        }

        function spawnEnemy() {
            const db = vocabDatabases[gameState.currentLang];
            const randomVocab = db[Math.floor(Math.random() * db.length)];
            const lanes = [80, 200, 320];
            const targetY = lanes[Math.floor(Math.random() * lanes.length)];

            // 依據危險分級決定外觀與血量
            let tier = Math.random();
            let hp = 100, radius = 18, color = "#ff0055";
            let typeName = "星塵獸";

            if (tier > 0.7) {
                hp = 220; radius = 24; color = "#9d00ff"; typeName = "超新星霸主"; // 菁英/霸主級
            } else if (tier > 0.4) {
                hp = 150; radius = 20; color = "#ffaa00"; typeName = "星体獸";
            }

            enemies.push({
                x: 820,
                y: targetY,
                radius: radius,
                speed: 0.45 + (gameState.wave * 0.03),
                targetWord: randomVocab.word,
                meaning: randomVocab.meaning,
                hp: hp,
                maxHp: hp,
                color: color,
                typeName: typeName
            });
        }

        function createWarpExplosion(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
