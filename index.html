<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>語靈陣線：宇宙星際防線 (Cosmic Lingo Frontline)</title>
    <style>
        :root {
            --bg-deep: #02040a;
            --panel-bg: rgba(10, 15, 30, 0.9);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-gold: #ffd700;
            --neon-purple: #9d00ff;
            --text-main: #f0f6fc;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #0d1b2a 0%, #02040a 100%);
        }
        header h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            text-shadow: 0 0 15px var(--neon-cyan);
            letter-spacing: 3px;
        }
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: bold;
        }
        .stat-box {
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            padding: 6px 16px;
            border-radius: 6px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
        }
        .game-container {
            position: relative;
            width: 800px;
            margin: 0 auto;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            background: #050814;
            border-radius: 8px;
        }
        canvas {
            display: block;
            background: linear-gradient(90deg, #070d1d 0%, #02040a 100%);
        }
        .control-panel {
            width: 800px;
            margin: 10px auto;
            background: var(--panel-bg);
            border: 1px solid var(--neon-gold);
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
        .cards-flex {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .card {
            background: #0d1b2a;
            border: 2px solid var(--neon-cyan);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--neon-cyan);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }
        .card:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
            transform: translateY(-3px);
        }
        .card.selected {
            border-color: var(--neon-gold);
            background: #2a220d;
            color: var(--neon-gold);
            box-shadow: 0 0 20px var(--neon-gold);
        }
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            margin-top: 8px;
        }
        button.primary-btn {
            padding: 8px 22px;
            background: var(--neon-pink);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            transition: 0.2s;
        }
        button.primary-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }
        select {
            background: #0d1b2a;
            color: #fff;
            border: 1px solid var(--neon-gold);
            padding: 6px;
            border-radius: 4px;
            font-family: inherit;
        }
        #combo-display {
            color: var(--neon-gold);
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }
        #combat-log {
            color: var(--neon-cyan);
            font-weight: bold;
            height: 22px;
            margin-top: 5px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌌 語靈陣線：宇宙防線 🌌</h1>
    </header>

    <div class="dashboard">
        <div class="stat-box">🛸 艦隊穹頂防護: <span id="base-hp" style="color:var(--neon-pink);">1000</span>/1000</div>
        <div class="stat-box">⚡ 戰術能量 MP: <span id="mp-val" style="color:var(--neon-cyan);">10</span>/10</div>
        <div class="stat-box">🌠 星際波次: <span id="wave-val" style="color:var(--neon-gold);">Sector 1</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div class="control-panel">
        <div style="margin-bottom: 8px; font-size: 0.85rem; color: #aaa;">
            🌐 星際語系終端機設定：
            <select id="lang-select" onchange="changeLanguageMode()">
                <option value="en">English (Cosmic Terms)</option>
                <option value="ja">日本語 (宇宙・天体)</option>
                <option value="es">Español (Espacio Estelar)</option>
                <option value="zh">中文 (星際天文詞彙)</option>
            </select>
        </div>

        <div id="combo-display">🔥 雙卡星際 Combo 槽位: 點擊 2 張手牌進行元素躍遷融合 (已選
