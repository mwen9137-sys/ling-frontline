<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語靈陣線 - Lingo Frontline (MVP)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- 遊戲標題與狀態列 -->
    <header class="w-full max-w-4xl flex justify-between items-center mb-4 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
        <div>
            <h1 class="text-2xl font-black text-amber-400 tracking-wider">🛡️ 語靈陣線 <span class="text-xs text-slate-400">Lingo Frontline MVP</span></h1>
            <p class="text-xs text-slate-400">代價平衡系統 × Combo 隨機召喚</p>
        </div>
        <div class="flex gap-6 text-sm font-bold">
            <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">❤️ 生命: <span id="hp-display" class="text-red-400">20</span></div>
            <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">💰 金幣: <span id="gold-display" class="text-amber-400">150</span></div>
            <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">⚔️ 波次: <span id="wave-display" class="text-blue-400">1 / 5</span></div>
        </div>
    </header>

    <!-- 遊戲主畫面與操作面板 -->
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-4 gap-4">
        
        <!-- 遊戲畫布 (Canvas) -->
        <div class="md:col-span-3 bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-700 relative flex justify-center items-center">
            <canvas id="gameCanvas" width="700" height="450" class="bg-slate-950 cursor-crosshair"></canvas>
            
            {/* 遊戲未開始或結束的遮罩提示 */}
            <div id="overlay-screen" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center text-center p-6">
                <h2 id="overlay-title" class="text-3xl font-bold mb-2 text-amber-400">準備好迎戰了嗎？</h2>
                <p id="overlay-desc" class="text-sm text-slate-300 mb-6 max-w-md">體驗「有得必有失」的塔防策略：建造防禦塔、或使用高風險的 Combo 雙牌隨機召喚！</p>
                <button id="start-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-3 rounded-xl shadow-lg transition transform hover:scale-105">
                    開始第一波防守
                </button>
            </div>
        </div>

        <!-- 側邊欄：防禦塔建造與代價平衡機制面板 -->
        <aside class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 flex flex-col justify-between">
            <div>
                <h3 class="text-sm font-bold text-slate-300 mb-3 uppercase tracking-wider border-b border-slate-700 pb-2">防禦與召喚指令</h3>
                
                <div class="space-y-3">
                    <!-- 近戰塔 -->
                    <button onclick="selectTower('melee')" class="w-full text-left bg-slate-900 hover:bg-slate-700 p-2.5 rounded-lg border border-slate-700 transition flex justify-between items-center group">
                        <div>
                            <div class="font-bold text-blue-400 text-sm">⚔️ 語靈騎士 (近戰)</div>
                            <div class="text-xs text-slate-400">血厚前線阻擋，無遠程</div>
                        </div>
                        <span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-1 rounded font-mono">50G</span>
                    </button>

                    <!-- 遠程塔 -->
                    <button onclick="selectTower('ranged')" class="w-full text-left bg-slate-900 hover:bg-slate-700 p-2.5 rounded-lg border border-slate-700 transition flex justify-between items-center group">
                        <div>
                            <div class="font-bold text-purple-400 text-sm">🏹 元素法師 (遠程)</div>
                            <div class="text-xs text-slate-400">高傷害群攻，血薄易碎</div>
                        </div>
                        <span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-1 rounded font-mono">75G</span>
                    </button>

                    <!-- Combo 隨機召喚機制 -->
                    <div class="pt-3 border-t border-slate-700">
                        <div class="font-bold text-amber-400 text-xs mb-1">🎲 Combo 雙牌隨機召喚</div>
                        <p class="text-xs text-slate-400 mb-2">高數值但兵種隨機，承擔賭博風險！</p>
                        <button onclick="triggerComboSummon()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-bold p-2.5 rounded-lg shadow transition text-xs">
                            發動雙牌 Combo (100G)
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-700 text-xs text-slate-400">
                <span class="text-amber-400 font-bold">提示：</span> 點擊左側地圖上的合法空格來放置防禦塔。
            </div>
        </aside>

    </main>

    <!-- 遊戲核心 JavaScript 邏輯 -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲狀態變數
        let gameState = 'START'; // START, PLAYING, GAMEOVER, WIN
        let hp = 20;
        let gold = 150;
        let wave = 1;
        let maxWaves = 5;
        let selectedTowerType = null;

        // 道路座標點 (仿王國保衛戰的曲折路線)
        const path = [
            {x: 0, y: 150},
            {x: 180, y: 150},
            {x: 180, y: 300},
            {x: 380, y: 300},
            {x: 380, y: 120},
            {x: 550, y: 120},
            {x: 550, y: 350},
            {x: 700, y: 350}
        ];

        let towers = [];
        let enemies = [];
        let bullets = [];

        // 塔位格子定義
        const buildSlots = [
            {x: 120, y: 90, occupied: false},
            {x: 240, y: 360, occupied: false},
            {x: 300, y: 240, occupied: false},
            {x: 440, y: 180, occupied: false},
            {x: 480, y: 60, occupied: false},
            {x: 610, y: 280, occupied: false}
        ];

        // 敵人物件
        class Enemy {
            constructor(waveMultiplier) {
                this.pathIndex = 0;
                this.x = path[0].x;
                this.y = path[0].y;
                this.speed = 1.2 + waveMultiplier * 0.2;
                this.maxHealth = 40 + waveMultiplier * 25;
                this.health = this.maxHealth;
                this.radius = 12;
            }

            update() {
                const target = path[this.pathIndex + 1];
                if (!target) return true; // 到達終點

                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.pathIndex++;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
                return false;
            }

            draw() {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#991b1b';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 血條
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x - 15, this.y - 20, 30, 5);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(this.x - 15, this.y - 20, 30 * (this.health / this.maxHealth), 5);
            }
        }

        // 防禦塔物件
        class Tower {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'melee' 或 'ranged' 或 'combo'
                this.range = type === 'ranged' ? 140 : 90;
                this.damage = type === 'ranged' ? 18 : 12;
                this.cooldown = 0;
                this.maxCooldown = type === 'ranged' ? 45 : 30;
            }

            update() {
                if (this.cooldown > 0) this.cooldown--;

                // 尋找範圍內第一個敵人
                let target = null;
                for (let e of enemies) {
                    if (Math.hypot(e.x - this.x, e.y - this.y) <= this.range) {
                        target = e;
                        break;
                    }
                }

                if (target && this.cooldown === 0) {
                    bullets.push({
                        x: this.x,
                        y: this.y,
                        target: target,
                        speed: 6,
                        damage: this.damage
                    });
                    this.cooldown = this.maxCooldown;
                }
            }

            draw() {
                ctx.fillStyle = this.type === 'ranged' ? '#a855f7' : (this.type === 'combo' ? '#f59e0b' : '#3b82f6');
                ctx.beginPath();
                ctx.arc(this.x, this.y, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.type === 'ranged' ? '法' : (this.type === 'combo' ? '超' : '戰'), this.x, this.y + 4);
            }
        }

        // 選擇防禦塔類型
        function selectTower(type) {
            selectedTowerType = type;
            alert(`已選擇：${type === 'melee' ? '語靈騎士 (50G)' : '元素法師 (75G)'}，請點擊地圖上的空格放置！`);
        }

        // 點擊地圖放置防禦塔
        canvas.addEventListener('click', (e) => {
            if (gameState !== 'PLAYING' || !selectedTowerType) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            for (let slot of buildSlots) {
                if (!slot.occupied && Math.hypot(slot.x - mouseX, slot.y - mouseY) < 25) {
                    let cost = selectedTowerType === 'ranged' ? 75 : 50;
                    if (gold >= cost) {
                        gold -= cost;
                        towers.push(new Tower(slot.x, slot.y, selectedTowerType));
                        slot.occupied = true;
                        selectedTowerType = null;
                        updateUI();
                    } else {
                        alert('金幣不足！');
                    }
                    break;
                }
            }
        });

        // Combo 隨機召喚機制
        function triggerComboSummon() {
            if (gold < 100) {
                alert('金幣不足 100G，無法發動 Combo 召喚！');
                return;
            }
            gold -= 100;
            
            // 隨機尋找一個空格
            let emptySlots = buildSlots.filter(s => !s.occupied);
            if (emptySlots.length === 0) {
                alert('沒有多餘的塔位可以召喚超級小兵了！');
                gold += 100;
                return;
            }

            let slot = emptySlots[Math.floor(Math.random() * emptySlots.length)];
            slot.occupied = true;
            
            // 隨機抽到強力或奇特的超級兵種（有得必有失的隨機性）
            let comboTypes = ['combo_giant', 'combo_sniper', 'combo_berserker'];
            let chosenType = comboTypes[Math.floor(Math.random() * comboTypes.length)];
            
            towers.push(new Tower(slot.x, slot.y, 'combo'));
            updateUI();
            alert('🎲 Combo 雙牌連線成功！隨機召喚出強力超級語靈！');
        }

        function updateUI() {
            document.getElementById('hp-display').innerText = hp;
            document.getElementById('gold-display').innerText = gold;
            document.getElementById('wave-display').innerText = `${wave} / ${maxWaves}`;
        }

        // 遊戲主迴圈
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 繪製地圖路線
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 32;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let p of path) ctx.lineTo(p.x, p.y);
            ctx.stroke();

            // 2. 繪製防禦塔空格
            for (let slot of buildSlots) {
                ctx.fillStyle = slot.occupied ? '#1e293b' : '#334155';
                ctx.beginPath();
                ctx.arc(slot.x, slot.y, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = slot.occupied ? '#475569' : '#64748b';
                ctx.stroke();
            }

            // 3. 更新與繪製敵人
            for (let i = enemies.length - 1; i >= 0; i--) {
                let reachedEnd = enemies[i].update();
                if (reachedEnd) {
                    enemies.splice(i, 1);
                    hp--;
                    updateUI();
                    if (hp <= 0) {
                        endGame(false);
                    }
                } else {
                    enemies[i].draw();
                }
            }

            // 4. 更新與繪製防禦塔
            for (let t of towers) {
                t.update();
                t.draw();
            }

            // 5. 更新與繪製子彈
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                let dx = b.target.x - b.x;
                let dy = b.target.y - b.y;
                let dist = Math.hypot(dx, dy);

                if (dist < b.speed || !enemies.includes(b.target)) {
                    if (enemies.includes(b.target)) {
                        b.target.health -= b.damage;
                        if (b.target.health <= 0) {
                            let index = enemies.indexOf(b.target);
                            if (index > -1) {
                                enemies.splice(index, 1);
                                gold += 25; // 擊殺獎勵
                                updateUI();
                            }
                        }
                    }
                    bullets.splice(i, 1);
                } else {
                    b.x += (dx / dist) * b.speed;
                    b.y += (dy / dist) * b.speed;
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 檢查波次是否清空
            if (gameState === 'PLAYING' && enemies.length === 0) {
                if (wave < maxWaves) {
                    wave++;
                    gold += 50; // 波次獎勵
                    updateUI();
                    startWave();
                } else {
                    endGame(true);
                }
            }

            if (gameState === 'PLAYING') {
                requestAnimationFrame(gameLoop);
            }
        }

        function startWave() {
            let enemyCount = 3 + wave * 2;
            let spawned = 0;
            let interval = setInterval(() => {
                if (spawned < enemyCount && gameState === 'PLAYING') {
                    enemies.push(new Enemy(wave));
                    spawned++;
                } else {
                    clearInterval(interval);
                }
            }, 1200);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('overlay-screen').classList.add('hidden');
            gameState = 'PLAYING';
            hp = 20;
            gold = 150;
            wave = 1;
            towers = [];
            enemies = [];
            bullets = [];
            // 重置塔位
            buildSlots.forEach(s => s.occupied = false);
            updateUI();
            startWave();
            gameLoop();
        });

        function endGame(isWin) {
            gameState = isWin ? 'WIN' : 'GAMEOVER';
            const overlay = document.getElementById('overlay-screen');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');
            const btn = document.getElementById('start-btn');

            overlay.classList.remove('hidden');
            if (isWin) {
                title.innerText = "🎉 勝利！語靈防線守住了！";
                desc.innerText = "你成功抵禦了所有怪獸的進攻，展現了極佳的塔防與代價平衡策略！";
            } else {
                title.innerText = "💀 防線崩潰...";
                desc.innerText = "怪獸突破了你的語靈陣線，再試一次，調整你的英雄與 Combo 策略吧！";
            }
            btn.innerText = "重新挑戰";
        }
    </script>
</body>
</html>
