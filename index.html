<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>語靈陣線 Lingo Frontline - Cyber Edition</title>
    <style>
        :root {
            --bg-color: #050811;
            --panel-bg: rgba(13, 18, 30, 0.92);
            --neon-cyan: #00ffcc;
            --neon-pink: #ff0055;
            --neon-gold: #ffcc00;
            --text-main: #f0f6fc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }
        header h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            text-shadow: 0 0 15px var(--neon-cyan);
            letter-spacing: 3px;
        }
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: bold;
        }
        .stat-box {
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            padding: 6px 16px;
            border-radius: 6px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
        }
        .game-container {
            position: relative;
            width: 800px;
            margin: 0 auto;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
            background: #0b0f19;
            border-radius: 6px;
        }
        canvas {
            display: block;
            background: linear-gradient(90deg, #0d121f 0%, #080b14 100%);
        }
        .control-panel {
            width: 800px;
            margin: 10px auto;
            background: var(--panel-bg);
            border: 1px solid var(--neon-gold);
            padding: 12px;
            border-radius: 6px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }
        .cards-flex {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .card {
            background: #151d30;
            border: 2px solid var(--neon-cyan);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            color: var(--neon-cyan);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .card:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
            transform: translateY(-3px);
        }
        .card.selected {
            border-color: var(--neon-gold);
            background: #3d341f;
            color: var(--neon-gold);
            box-shadow: 0 0 20px var(--neon-gold);
        }
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            margin-top: 8px;
        }
        button.primary-btn {
            padding: 8px 22px;
            background: var(--neon-pink);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            transition: 0.2s;
        }
        button.primary-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }
        select {
            background: #151d30;
            color: #fff;
            border: 1px solid var(--neon-gold);
            padding: 6px;
            border-radius: 4px;
            font-family: inherit;
        }
        #combo-display {
            color: var(--neon-gold);
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }
        #combat-log {
            color: var(--neon-cyan);
            font-weight: bold;
            height: 22px;
            margin-top: 5px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>《語靈陣線》LINGO FRONTLINE</h1>
    </header>

    <div class="dashboard">
        <div class="stat-box">🏰 主城防禦: <span id="base-hp" style="color:var(--neon-pink);">100</span>/100</div>
        <div class="stat-box">⚡ 戰術 MP: <span id="mp-val" style="color:var(--neon-cyan);">10</span>/10</div>
        <div class="stat-box">🌊 戰鬥波次: <span id="wave-val" style="color:var(--neon-gold);">Wave 1</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div class="control-panel">
        <div style="margin-bottom: 8px; font-size: 0.85rem; color: #aaa;">
            🌍 語言學習模式設定：
            <select id="lang-select" onchange="changeLanguageMode()">
                <option value="en">英語 (English - Advanced Tactic)</option>
                <option value="ja">日本語 (Japanese - JLPT N3/N2)</option>
                <option value="es">Español (Spanish - Phonetic)</option>
            </select>
        </div>

        <div id="combo-display">🔥 雙卡 Combo 槽位: 請點擊兩張手牌進行屬性融合 (已選 0/2)</div>
        <div class="cards-flex" id="hand-container"></div>

        <div class="action-bar">
            <button class="primary-btn" onclick="startVoiceRecognition()">🎙️ 啟動戰術語音吟詠</button>
            <span id="mic-status" style="font-size: 0.85rem; color: var(--neon-gold);">等待語音指令...</span>
        </div>
        <div id="combat-log">系統就緒：選定 2 張元素卡牌並唸出敵方目標單字發動特效打擊！</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = {
            baseHp: 100,
            mp: 10,
            maxMp: 10,
            wave: 1,
            currentLang: 'en'
        };

        const vocabDatabases = {
            en: [
                { word: "Frost", meaning: "冰霜" },
                { word: "Ignite", meaning: "點燃" },
                { word: "Thunder", meaning: "雷霆" },
                { word: "Shadow", meaning: "暗影" }
            ],
            ja: [
                { word: "Kōri", meaning: "氷 (冰)" },
                { word: "Honō", meaning: "炎 (火)" },
                { word: "Inazuma", meaning: "稲妻 (雷)" },
                { word: "Kage", meaning: "影 (暗)" }
            ],
            es: [
                { word: "Fuego", meaning: "火" },
                { word: "Hielo", meaning: "冰" },
                { word: "Rayo", meaning: "雷" },
                { word: "Sombra", meaning: "影" }
            ]
        };

        let playerHand = [
            { id: 1, name: "元素·水 (Water)", element: "water", cost: 2 },
            { id: 2, name: "元素·火 (Fire)", element: "fire", cost: 2 },
            { id: 3, name: "元素·雷 (Thunder)", element: "thunder", cost: 3 },
            { id: 4, name: "元素·風 (Wind)", element: "wind", cost: 2 }
        ];

        let selectedCards = [];
        let enemies = [];
        let particles = []; // 擊殺爆炸粒子特效

        function initHand() {
            const container = document.getElementById("hand-container");
            container.innerHTML = "";
            playerHand.forEach((card) => {
                let div = document.createElement("div");
                div.className = "card";
                div.dataset.id = card.id;
                div.innerHTML = `<b>${card.name}</b><br><small>消耗: ${card.cost} MP</small>`;
                div.onclick = () => toggleCardSelection(card, div);
                container.appendChild(div);
            });
        }

        function toggleCardSelection(card, elementNode) {
            const index = selectedCards.findIndex(c => c.id === card.id);
            if (index > -1) {
                selectedCards.splice(index, 1);
                elementNode.classList.remove("selected");
            } else {
                if (selectedCards.length < 2) {
                    selectedCards.push(card);
                    elementNode.classList.add("selected");
                } else {
                    document.getElementById("combat-log").innerText = "⚠️ 最多只能選擇 2 張元素卡牌！";
                    return;
                }
            }
            updateComboStatus();
        }

        function updateComboStatus() {
            if (selectedCards.length === 2) {
                let comboName = getComboEffect(selectedCards[0].element, selectedCards[1].element);
                document.getElementById("combo-display").innerText = `⚡ 完美融合就緒！【${comboName}】 ➔ 準備語音吟詠！`;
            } else {
                document.getElementById("combo-display").innerText = `🔥 雙卡 Combo 槽位: 已選 ${selectedCards.length}/2 張`;
            }
        }

        function getComboEffect(el1, el2) {
            let pair = [el1, el2].sort().join("+");
            if (pair === "fire+water") return "蒸氣爆破 (Steam Blast)";
            if (pair === "thunder+water") return "高壓感電 (Electro-Shock)";
            if (pair === "fire+thunder") return "超載熔斷 (Overload Fusion)";
            return "元素共鳴 (Resonance)";
        }

        function spawnEnemy() {
            const db = vocabDatabases[gameState.currentLang];
            const randomVocab = db[Math.floor(Math.random() * db.length)];
            const lanes = [80, 200, 320];
            const targetY = lanes[Math.floor(Math.random() * lanes.length)];

            enemies.push({
                x: 820,
                y: targetY,
                radius: 20,
                speed: 0.5, // 調整速度讓玩家有充裕時間反應
                targetWord: randomVocab.word,
                meaning: randomVocab.meaning,
                hp: 100,
                maxHp: 100
            });
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 4 + 2,
                    color: Math.random() > 0.5 ? '#00ffcc' : '#ff0055',
                    life: 40
                });
            }
        }

        function changeLanguageMode() {
            gameState.currentLang = document.getElementById("lang-select").value;
            enemies.forEach(e => {
                const db = vocabDatabases[gameState.currentLang];
                const rv = db[Math.floor(Math.random() * db.length)];
                e.targetWord = rv.word;
                e.meaning = rv.meaning;
            });
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製科技跑道格線
            ctx.strokeStyle = "rgba(0, 255, 204, 0.12)";
            ctx.lineWidth = 1.5;
            for (let i = 1; i <= 3; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * 100);
                ctx.lineTo(800, i * 100);
                ctx.stroke();
            }

            // 繪製防守主城
            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(20, 40, 15, 320);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 10px monospace";
            ctx.fillText("BASE", 12, 200);

            // 繪製爆炸粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                if (p.life <= 0) particles.splice(i, 1);
            }

            // 更新與繪製怪獸
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                en.x -= en.speed;

                // 繪製賽博風格幾何敵人
                ctx.fillStyle = "#ff0055";
                ctx.beginPath();
                ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#00ffcc";
                ctx.lineWidth = 2;
                ctx.stroke();

                // 頭頂字體
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 12px monospace";
                ctx.fillText(`Target: ${en.targetWord} (${en.meaning})`, en.x - 55, en.y - 28);

                // 血條
                ctx.fillStyle = "#222";
                ctx.fillRect(en.x - 22, en.y + 24, 44, 6);
                ctx.fillStyle = "#00ffcc";
                let hpBarWidth = (en.hp / en.maxHp) * 44;
                ctx.fillRect(en.x - 22, en.y + 24, Math.max(0, hpBarWidth), 6);

                if (en.x <= 40) {
                    gameState.baseHp -= 10;
                    document.getElementById("base-hp").innerText = Math.max(0, gameState.baseHp);
                    createExplosion(en.x, en.y);
                    enemies.splice(i, 1);
                    if (gameState.baseHp <= 0) {
                        alert("⚠️ 防線崩潰！主城陷落，重置戰局。");
                        gameState.baseHp = 100;
                        enemies = [];
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("請使用 Google Chrome 瀏覽器以支援語音辨識！");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = gameState.currentLang === 'ja' ? 'ja-JP' : (gameState.currentLang === 'es' ? 'es-ES' : 'en-US');
            recognition.start();

            document.getElementById("mic-status").innerText = "🔴 聆聽中... 請清晰唸出目標單字";

            recognition.onresult = function(event) {
                const said = event.results[0][0].transcript.trim();
                document.getElementById("mic-status").innerText = `🎙️ 辨識結果: "${said}"`;

                let damage = 50;
                let bonusMsg = "";
                if (selectedCards.length === 2) {
                    damage = 100;
                    bonusMsg = " 🌟 Combo 暴擊！";
                    selectedCards = [];
                    initHand();
                    updateComboStatus();
                }

                let hitFound = false;
                for (let i = 0; i < enemies.length; i++) {
                    if (said.toLowerCase().includes(enemies[i].targetWord.toLowerCase())) {
                        enemies[i].hp -= damage;
                        hitFound = true;
                        document.getElementById("combat-log").innerText = `⚡ 命中 【${enemies[i].targetWord}】！造成 ${damage} 傷害${bonusMsg}`;
                        
                        if (enemies[i].hp <= 0) {
                            createExplosion(enemies[i].x, enemies[i].y);
                            enemies.splice(i, 1);
                            gameState.mp = Math.min(10, gameState.mp + 3);
                            document.getElementById("mp-val").innerText = gameState.mp;
                        }
                        break;
                    }
                }

                if (!hitFound) {
                    document.getElementById("combat-log").innerText = `❌ 未命中目標（你唸了: ${said}）`;
                }
            };
        }

        setInterval(() => {
            if (enemies.length < 4) {
                spawnEnemy();
            }
        }, 5000);

        initHand();
        gameLoop();
    </script>
</body>
</html>
